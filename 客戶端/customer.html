<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>尊榮會員禮遇與精選菜單 - 頂級餐飲集團</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        luxury: {
                            900: '#0f1115',
                            800: '#181b22',
                            700: '#262a33',
                            gold: '#d4af37',
                            goldLight: '#f3e5ab',
                            goldDark: '#aa8c2c'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap');
        body { font-family: 'Plus Jakarta Sans', 'Noto Serif TC', serif; }
        .gold-gradient-text {
            background: linear-gradient(135deg, #f3e5ab 0%, #d4af37 50%, #aa8c2c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-luxury-900 text-slate-200 font-sans min-h-screen flex flex-col antialiased selection:bg-luxury-gold selection:text-luxury-900" onload="loadDynamicMenu()">

    <header class="bg-luxury-900/90 backdrop-blur-md border-b border-luxury-700/60 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-6 py-5 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">⚜️</span>
                <h1 class="text-lg font-bold tracking-widest gold-gradient-text uppercase">MEMBER CLUB & MENU</h1>
            </div>
            <a href="../監管者/admin.html" class="text-xs tracking-wider text-luxury-goldLight/70 hover:text-luxury-gold bg-luxury-800 hover:bg-luxury-700 px-4 py-2 rounded-full border border-luxury-gold/30 transition shadow-sm">
                員工/管理後台 ↗
            </a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-14 flex-grow w-full space-y-12">
        
        <!-- 查詢輸入區 -->
        <section id="login-card" class="bg-luxury-800/80 backdrop-blur-xl p-10 sm:p-12 rounded-3xl shadow-2xl border border-luxury-gold/20 space-y-8 text-center max-w-xl mx-auto transition-all">
            <div class="space-y-3">
                <span class="text-3xl">🍸</span>
                <h2 class="text-3xl font-serif font-bold text-white tracking-wide">尊榮禮遇與點數查詢</h2>
                <p class="text-sm text-slate-400 font-light">請輸入您的貴賓手機號碼，解鎖專屬會籍權益。</p>
            </div>
            
            <div class="space-y-5 pt-2">
                <div class="relative">
                    <input type="text" id="query-phone-input" placeholder="請輸入手機號碼 (例: 0912345678)" class="w-full bg-luxury-900/90 border border-luxury-700 rounded-2xl px-5 py-4 text-center text-xl tracking-widest text-luxury-goldLight font-medium focus:ring-2 focus:ring-luxury-gold focus:border-transparent focus:outline-none transition placeholder:text-slate-600">
                </div>
                <button onclick="queryCustomerPoints()" class="w-full bg-gradient-to-r from-luxury-goldDark via-luxury-gold to-luxury-goldLight hover:opacity-90 active:scale-[0.99] text-luxury-900 font-bold py-4 rounded-2xl transition shadow-lg shadow-luxury-gold/10 tracking-widest uppercase text-sm">
                    立即驗證查詢
                </button>
            </div>
        </section>

        <!-- 查詢成功後的結果區 -->
        <div id="customer-query-result" class="space-y-8 hidden">
            <div class="bg-gradient-to-br from-luxury-800 via-luxury-700 to-luxury-900 text-white p-8 sm:p-10 rounded-3xl shadow-2xl border border-luxury-gold/40 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-6 relative overflow-hidden">
                <div class="absolute -right-10 -bottom-10 text-9xl text-luxury-gold/5 select-none pointer-events-none font-serif">VIP</div>
                <div class="space-y-2 relative z-10">
                    <span class="text-xs uppercase tracking-[0.3em] text-luxury-gold font-semibold">Exquisite Membership</span>
                    <h3 id="welcome-message" class="text-3xl font-serif font-bold tracking-tight text-white">尊貴的貴賓</h3>
                    <p id="display-phone-sub" class="text-xs text-slate-400 tracking-wider">已驗證手機：--</p>
                </div>
                <button onclick="resetQuery()" class="relative z-10 text-xs bg-luxury-900/60 hover:bg-luxury-900 text-luxury-goldLight px-5 py-2.5 rounded-xl transition border border-luxury-gold/30 tracking-wider">
                    切換號碼查詢
                </button>
            </div>

            <div class="flex justify-between items-center px-2 border-b border-luxury-700/50 pb-4">
                <h4 class="text-xs font-bold text-luxury-gold uppercase tracking-[0.2em]">集團旗下分店資產與動態禮遇規則</h4>
                <span class="text-xs text-emerald-400 font-medium flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> 雲端即時同步
                </span>
            </div>

            <div id="customer-cards-container" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </div>

        <!-- 頂級餐廳動態精選菜單專區 (支援圖片展示) -->
        <section class="space-y-6 pt-6 border-t border-luxury-700/50">
            <div class="text-center space-y-2">
                <span class="text-xs font-bold tracking-[0.3em] text-luxury-gold uppercase">Gastronomy Menu</span>
                <h3 class="text-3xl font-serif font-bold text-white tracking-wide">集團精選主廚饗宴</h3>
                <p class="text-sm text-slate-400 font-light">嚴選頂級食材，演繹法式與日式美學的極致碰撞。</p>
            </div>

            <div id="dynamic-menu-container" class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4">
                <div class="col-span-full text-center py-10 text-slate-500">載入雲端菜單中...</div>
            </div>
        </section>

    </main>

    <footer class="text-center py-8 text-xs text-slate-500 border-t border-luxury-700/40 mt-auto tracking-widest uppercase">
        &copy; 2026 頂級餐飲集團會員中心. All Rights Reserved.
    </footer>

    <script>
        const SUPABASE_URL = 'https://lqhiolijrejahmzoulcs.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxxaGlvbGlqcmVqYWhtem91bGNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5NTQ3ODYsImV4cCI6MjEwODUzMDc4Nn0.qDpea3h33N8WLK1WtL8JQ10D3y1rfiicxFqTFyx9nBs';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentSearchedPhone = null;

        async function loadDynamicMenu() {
            const { data: menuList } = await _supabase.from('menus').select('*');
            const { data: storeList } = await _supabase.from('stores').select('*');
            const container = document.getElementById('dynamic-menu-container');
            container.innerHTML = '';

            const items = menuList || [];
            const stores = storeList || [];

            if (items.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500 bg-luxury-800/40 rounded-3xl border border-luxury-700">目前尚無上架菜單品項</div>`;
                return;
            }

            items.forEach(m => {
                const store = stores.find(s => s.code === m.store_code);
                const storeName = store ? store.name : m.store_code;
                const imgTag = m.image_url ? `<div class="overflow-hidden rounded-2xl mb-4 h-48"><img src="${m.image_url}" class="w-full h-full object-cover hover:scale-105 transition duration-500"></div>` : '';

                container.innerHTML += `
                    <div class="bg-luxury-800/60 border border-luxury-700/60 p-6 rounded-3xl hover:border-luxury-gold/40 transition duration-300 space-y-3 flex flex-col justify-between">
                        <div>
                            ${imgTag}
                            <div class="flex justify-between items-baseline">
                                <div>
                                    <h4 class="font-serif font-bold text-xl text-luxury-goldLight">${m.name}</h4>
                                    <span class="text-[11px] text-amber-500 uppercase tracking-wider">分店：${storeName}</span>
                                </div>
                                <span class="font-serif font-semibold text-white tracking-wider">$ ${m.price}</span>
                            </div>
                            <p class="text-xs text-slate-400 leading-relaxed font-light mt-2">${m.description || '暫無詳細描述。'}</p>
                        </div>
                    </div>
                `;
            });
        }

        async function queryCustomerPoints() {
            const phone = document.getElementById('query-phone-input').value.trim();
            if (!phone) { alert('請輸入您的貴賓手機號碼'); return; }
            currentSearchedPhone = phone;
            await renderResults(phone);
        }

        async function renderResults(phone) {
            const loginCard = document.getElementById('login-card');
            const resultBox = document.getElementById('customer-query-result');
            const container = document.getElementById('customer-cards-container');

            const { data: stores } = await _supabase.from('stores').select('*');
            const { data: customers } = await _supabase.from('customers').select('*').eq('phone', phone);
            const { data: rules } = await _supabase.from('rules').select('*');

            const storeList = stores || [];
            const customerRecords = customers || [];
            const ruleList = rules || [];

            loginCard.classList.add('hidden');
            resultBox.classList.remove('hidden');
            container.innerHTML = '';

            if (customerRecords.length === 0) {
                document.getElementById('welcome-message').innerText = `查無此會籍紀錄`;
                document.getElementById('display-phone-sub').innerText = `已驗證手機：${phone}`;
                
                container.innerHTML = `
                    <div class="col-span-full bg-luxury-800/90 backdrop-blur-md p-10 rounded-3xl shadow-xl border border-luxury-gold/30 text-center space-y-4">
                        <span class="text-4xl">🛎️</span>
                        <h3 class="font-serif font-bold text-2xl text-white tracking-wide">尚未開立專屬會籍</h3>
                        <p class="text-sm text-slate-400 font-light max-w-md mx-auto">此手機號碼尚未在集團旗下分店註冊。如需享有尊榮禮遇與點數累積，請洽詢現場專業店員為您辦理開卡。</p>
                        <div class="pt-2">
                            <button onclick="resetQuery()" class="text-xs bg-luxury-900 hover:bg-luxury-700 text-luxury-gold px-6 py-3 rounded-xl border border-luxury-gold/40 transition tracking-widest uppercase font-semibold">
                                重新輸入號碼
                            </button>
                        </div>
                    </div>
                `;
                return;
            }

            let customerName = null;
            let customerGender = '先生';
            for (let c of customerRecords) {
                if (c.name) {
                    customerName = c.name;
                    if (c.gender) customerGender = c.gender;
                    break;
                }
            }

            if (customerName) {
                document.getElementById('welcome-message').innerText = `歡迎回來，${customerName} ${customerGender}`;
            } else {
                document.getElementById('welcome-message').innerText = `歡迎貴賓蒞臨`;
            }
            
            document.getElementById('display-phone-sub').innerText = `已驗證貴賓手機：${phone}`;

            if (storeList.length === 0) {
                container.innerHTML = `<div class="col-span-2 text-center py-12 text-slate-500 bg-luxury-800 rounded-3xl border border-luxury-700">目前集團尚無分店資料</div>`;
                return;
            }

            storeList.forEach(store => {
                const cData = customerRecords.find(item => item.store_code === store.code) || { points: 0, updated: '尚無消費紀錄' };
                const rData = ruleList.find(item => item.store_code === store.code) || { earn_rate: 100, redeem_rate: 1 };

                container.innerHTML += `
                    <div class="bg-luxury-800/90 backdrop-blur-md p-8 rounded-3xl shadow-xl border border-luxury-700/80 hover:border-luxury-gold/50 transition duration-300 flex flex-col justify-between space-y-6 group">
                        <div class="flex justify-between items-start">
                            <div>
                                <h5 class="font-serif font-bold text-xl text-white tracking-wide group-hover:text-luxury-goldLight transition">${store.name}</h5>
                                <span class="text-xs text-slate-500 tracking-wider">統一編號：${store.tax_id}</span>
                            </div>
                            <span class="bg-luxury-gold/10 text-luxury-gold text-xs px-3 py-1 rounded-full font-medium border border-luxury-gold/30 tracking-widest uppercase">VIP 尊榮營運</span>
                        </div>

                        <div class="bg-luxury-900/80 p-5 rounded-2xl flex justify-between items-center border border-luxury-700/50">
                            <div>
                                <span class="text-xs text-slate-400 font-medium tracking-widest uppercase block mb-1">可用點數資產</span>
                                <span class="text-3xl font-serif font-bold text-luxury-goldLight tracking-tight">${cData.points} <span class="text-sm font-normal text-slate-400">點</span></span>
                            </div>
                            <div class="text-right">
                                <span class="text-[11px] text-slate-500 block">最後饗宴異動</span>
                                <span class="text-xs text-slate-300 font-medium">${cData.updated || '尚無紀錄'}</span>
                            </div>
                        </div>

                        <div class="text-xs text-luxury-goldLight/90 bg-luxury-900/40 border border-luxury-gold/20 p-4 rounded-2xl flex items-center justify-between tracking-wide">
                            <span class="text-slate-400">💎 即時禮遇規則</span>
                            <span class="font-semibold">消費滿 $${rData.earn_rate} 累積 1 點 ｜ 1 點折抵 $${rData.redeem_rate}</span>
                        </div>
                    </div>
                `;
            });
        }

        function resetQuery() {
            currentSearchedPhone = null;
            document.getElementById('login-card').classList.remove('hidden');
            document.getElementById('customer-query-result').classList.add('hidden');
            document.getElementById('query-phone-input').value = '';
        }
    </script>
</body>
</html>
