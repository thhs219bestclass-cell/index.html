<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員專屬服務中心 - 點數與優惠查詢</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eef2ff', 100: '#e0e7ff', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col antialiased">

    <!-- 頂部質感導覽列 -->
    <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">💎</span>
                <h1 class="text-lg font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent tracking-tight">會員專屬服務中心</h1>
            </div>
            <a href="admin.html" class="text-xs font-medium text-slate-500 hover:text-indigo-600 bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-full transition">商家管理登入 ↗</a>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-4xl mx-auto px-6 py-10 flex-grow w-full space-y-8">
        
        <!-- 登入與查詢區塊 -->
        <section id="login-card" class="bg-white p-8 sm:p-10 rounded-2xl shadow-sm border border-slate-200/80 space-y-6 text-center max-w-xl mx-auto transition-all">
            <div class="space-y-2">
                <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold shadow-inner mb-4">📱</div>
                <h2 class="text-2xl font-bold text-slate-900 tracking-tight">快速查詢會員點數</h2>
                <p class="text-sm text-slate-500">請輸入您的手機號碼，立即解鎖您的專屬點數與權益。</p>
            </div>
            
            <div class="space-y-4 pt-2">
                <div class="relative">
                    <input type="text" id="query-phone-input" placeholder="請輸入手機號碼 (例: 0912345678)" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3.5 text-center text-lg tracking-wider font-medium focus:ring-2 focus:ring-indigo-600 focus:bg-white focus:outline-none transition">
                </div>
                <button onclick="queryCustomerPoints()" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-semibold py-3.5 rounded-xl transition shadow-md shadow-indigo-200">
                    立即查詢點數
                </button>
            </div>
        </section>

        <!-- 查詢成功後的歡迎與點數列表區塊 -->
        <div id="customer-query-result" class="space-y-6 hidden">
            
            <!-- 帶有 xxx先生/小姐 的專屬歡迎橫幅 -->
            <div class="bg-gradient-to-r from-indigo-900 to-indigo-800 text-white p-6 sm:p-8 rounded-2xl shadow-md flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div class="space-y-1">
                    <span class="text-xs uppercase tracking-widest text-indigo-300 font-semibold">Member Portal</span>
                    <h3 id="welcome-message" class="text-2xl font-bold tracking-tight">您好，貴賓</h3>
                    <p id="display-phone-sub" class="text-xs text-indigo-200">已驗證手機：0912345678</p>
                </div>
                <button onclick="resetQuery()" class="text-xs bg-white/10 hover:bg-white/20 text-white px-4 py-2 rounded-xl transition border border-white/10">
                    切換查詢號碼
                </button>
            </div>

            <div class="flex justify-between items-center px-1">
                <h4 class="text-sm font-bold text-slate-700 uppercase tracking-wider">各分店點數資產與規則總覽</h4>
                <span class="text-xs text-slate-400 font-medium">資料即時同步更新</span>
            </div>

            <!-- 各店點數卡片容器 -->
            <div id="customer-cards-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- 動態生成 -->
            </div>
        </div>

    </main>

    <!-- 頁尾 -->
    <footer class="text-center py-6 text-xs text-slate-400 border-t border-slate-200 mt-auto">
        &copy; 2026 多店點數整合系統. All Rights Reserved.
    </footer>

    <!-- 邏輯腳本 -->
    <script>
        function queryCustomerPoints() {
            const phone = document.getElementById('query-phone-input').value.trim();
            const loginCard = document.getElementById('login-card');
            const resultBox = document.getElementById('customer-query-result');
            const container = document.getElementById('customer-cards-container');

            if (!phone) {
                alert('請輸入您的手機號碼！');
                return;
            }

            let db = JSON.parse(localStorage.getItem('pos_db'));

            if (!db || !db.stores || db.stores.length === 0) {
                db = {
                    stores: [
                        { name: "台北旗艦店", taxId: "12345678", code: "store01" },
                        { name: "台中逢甲店", taxId: "87654321", code: "store02" }
                    ],
                    rules: {
                        "store01": { earnRate: 100, redeemRate: 1 },
                        "store02": { earnRate: 50, redeemRate: 2 }
                    },
                    customers: {
                        "store01": { "0912345678": { name: "王小明", points: 50, updated: "2026-10-24" } },
                        "store02": { "0912345678": { name: "王小明", points: 120, updated: "2026-10-24" } }
                    }
                };
                localStorage.setItem('pos_db', JSON.stringify(db));
            }

            let customerName = null;
            for (let storeCode in db.customers) {
                if (db.customers[storeCode][phone] && db.customers[storeCode][phone].name) {
                    customerName = db.customers[storeCode][phone].name;
                    break;
                }
            }

            if (customerName) {
                document.getElementById('welcome-message').innerText = `歡迎回來，${customerName} 先生 / 小姐`;
            } else {
                document.getElementById('welcome-message').innerText = `歡迎回來，貴賓`;
            }
            
            document.getElementById('display-phone-sub').innerText = `已驗證手機：${phone}`;

            loginCard.classList.add('hidden');
            resultBox.classList.remove('hidden');
            container.innerHTML = '';

            db.stores.forEach(store => {
                const storeCustomers = db.customers[store.code] || {};
                const customerData = storeCustomers[phone] || { points: 0, updated: '尚無交易紀錄' };
                const rule = db.rules[store.code] || { earnRate: 100, redeemRate: 1 };

                container.innerHTML += `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 hover:shadow-md transition flex flex-col justify-between space-y-4">
                        <div class="flex justify-between items-start">
                            <div>
                                <h5 class="font-bold text-lg text-slate-900">${store.name}</h5>
                                <span class="text-xs text-slate-400">統一編號：${store.taxId}</span>
                            </div>
                            <span class="bg-emerald-50 text-emerald-700 text-xs px-2.5 py-1 rounded-full font-medium border border-emerald-100">營運中</span>
                        </div>

                        <div class="bg-slate-50 p-4 rounded-xl flex justify-between items-center border border-slate-100">
                            <div>
                                <span class="text-xs text-slate-500 font-medium block">可用點數餘額</span>
                                <span class="text-3xl font-extrabold text-emerald-600 tracking-tight">${customerData.points} <span class="text-sm font-normal text-slate-600">點</span></span>
                            </div>
                            <div class="text-right">
                                <span class="text-[11px] text-slate-400 block">最後異動</span>
                                <span class="text-xs text-slate-600 font-medium">${customerData.updated}</span>
                            </div>
                        </div>

                        <div class="text-xs text-indigo-700 bg-indigo-50/70 border border-indigo-100/60 p-3 rounded-xl flex items-center justify-between">
                            <span>💡 店家集點規則</span>
                            <span class="font-semibold">滿 ${rule.earnRate} 元集 1 點 ｜ 1 點折 ${rule.redeemRate} 元</span>
                        </div>
                    </div>
                `;
            });
        }

        function resetQuery() {
            document.getElementById('login-card').classList.remove('hidden');
            document.getElementById('customer-query-result').classList.add('hidden');
            document.getElementById('query-phone-input').value = '';
        }
    </script>
</body>
</html>
