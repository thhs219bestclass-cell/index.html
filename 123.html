<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase 雲端多店 POS 系統（具備密碼保護）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eef2ff', 100: '#e0e7ff', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col antialiased">

    <!-- 頂部導覽列 -->
    <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🔒</span>
                <h1 class="text-lg font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent tracking-tight">雲端安全 POS 系統</h1>
            </div>
            <div class="flex items-center space-x-3">
                <span id="header-status-badge" class="hidden text-xs bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full font-medium border border-indigo-100">未登入</span>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-6xl mx-auto px-6 py-10 flex-grow w-full space-y-8">

        <!-- 1. 登入畫面 -->
        <section id="view-login" class="max-w-md mx-auto bg-white p-8 sm:p-10 rounded-2xl shadow-sm border border-slate-200/80 space-y-6">
            <div class="text-center space-y-2">
                <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold shadow-inner mb-4">🔑</div>
                <h2 class="text-2xl font-bold text-slate-900 tracking-tight">請輸入登入密碼</h2>
                <p class="text-sm text-slate-500">支援雲端多店即時同步與權限控管</p>
            </div>

            <div class="space-y-4 pt-2">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">登入身分</label>
                    <select id="login-role" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-slate-700 font-medium focus:ring-2 focus:ring-indigo-600 focus:bg-white focus:outline-none transition">
                        <option value="admin">系統管理員 (總公司)</option>
                        <option value="store">店家員工 (分店獨立代碼)</option>
                    </select>
                </div>

                <div id="store-code-wrapper" class="hidden space-y-1.5">
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">店家代碼</label>
                    <input type="text" id="login-store-code" placeholder="請輸入分店代碼 (例: store01)" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-slate-700 font-medium focus:ring-2 focus:ring-indigo-600 focus:bg-white focus:outline-none transition">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">登入密碼</label>
                    <input type="password" id="login-password" placeholder="請輸入密碼 (預設管理員: 8888)" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-slate-700 font-medium focus:ring-2 focus:ring-indigo-600 focus:bg-white focus:outline-none transition">
                </div>

                <button onclick="handleLogin()" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-semibold py-3.5 rounded-xl transition shadow-md shadow-indigo-200 mt-2">
                    安全登入系統
                </button>
            </div>
        </section>

        <!-- 2. 管理員儀表板 (Super Admin) -->
        <section id="view-admin" class="hidden space-y-6">
            <div class="bg-gradient-to-r from-slate-900 to-indigo-950 text-white p-6 rounded-2xl shadow-md flex justify-between items-center">
                <div>
                    <span class="text-xs uppercase tracking-widest text-indigo-400 font-semibold">Super Admin Portal</span>
                    <h2 class="text-2xl font-bold tracking-tight">系統管理總控台</h2>
                </div>
                <button onclick="handleLogout()" class="text-xs bg-white/10 hover:bg-white/20 text-white px-4 py-2 rounded-xl border border-white/10">登出</button>
            </div>

            <div class="flex space-x-2 bg-white p-1.5 rounded-xl border border-slate-200/80 shadow-sm w-fit">
                <button onclick="switchTab('stores')" id="tab-stores-btn" class="px-5 py-2.5 font-medium text-sm rounded-lg bg-indigo-600 text-white shadow-sm transition">分店管理</button>
                <button onclick="switchTab('rules')" id="tab-rules-btn" class="px-5 py-2.5 font-medium text-sm rounded-lg text-slate-600 hover:text-slate-900 transition">集點規則</button>
                <button onclick="switchTab('security')" id="tab-security-btn" class="px-5 py-2.5 font-medium text-sm rounded-lg text-slate-600 hover:text-slate-900 transition">管理員密碼設定</button>
            </div>

            <!-- 分店管理 -->
            <div id="tab-stores-content" class="space-y-6">
                <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-200/80 space-y-4">
                    <h3 class="text-lg font-bold text-slate-900">➕ 新增分店（需設定分店員工密碼）</h3>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <input type="text" id="new-store-name" placeholder="分店名稱" class="bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm">
                        <input type="text" id="new-store-tax" placeholder="統一編號 (8碼)" class="bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm">
                        <input type="text" id="new-store-code" placeholder="登入代碼 (例: store01)" class="bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm">
                        <input type="password" id="new-store-pwd" placeholder="分店員工登入密碼" class="bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm">
                    </div>
                    <button onclick="addStore()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-6 py-3 rounded-xl text-sm mt-2">新增分店</button>
                </div>

                <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-200/80 space-y-4">
                    <h3 class="text-lg font-bold text-slate-900">📋 分店清單</h3>
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-200 text-slate-400 text-xs uppercase">
                                <th class="py-3 px-4">分店名稱</th>
                                <th class="py-3 px-4">統一編號</th>
                                <th class="py-3 px-4">登入代碼</th>
                                <th class="py-3 px-4 text-right">操作</th>
                            </tr>
                        </thead>
                        <tbody id="store-list-table" class="divide-y divide-slate-100 text-sm"></tbody>
                    </table>
                </div>
            </div>

            <!-- 規則設定 -->
            <div id="tab-rules-content" class="hidden bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-200/80 space-y-6">
                <h3 class="text-lg font-bold text-slate-900">⚙️ 設定各店集點規則</h3>
                <div class="max-w-md">
                    <label class="block text-xs font-medium text-slate-500 mb-1">選擇分店</label>
                    <select id="rule-store-select" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm" onchange="loadRules()"></select>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-50 p-6 rounded-2xl border">
                    <div><label class="block text-xs font-bold mb-1">消費金額折抵 1 點 (元)</label><input type="number" id="rule-earn" class="w-full bg-white border border-slate-300 rounded-xl p-3 text-sm"></div>
                    <div><label class="block text-xs font-bold mb-1">每 1 點折抵現金 (元)</label><input type="number" id="rule-redeem" class="w-full bg-white border border-slate-300 rounded-xl p-3 text-sm"></div>
                </div>
                <button onclick="saveRules()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-xl text-sm">儲存規則</button>
            </div>

            <!-- 管理員密碼設定 -->
            <div id="tab-security-content" class="hidden bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-200/80 space-y-6">
                <h3 class="text-lg font-bold text-slate-900">🔒 變更系統管理員密碼</h3>
                <div class="max-w-md space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">新管理員密碼</label>
                        <input type="password" id="new-admin-password" placeholder="請輸入新密碼" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm">
                    </div>
                    <button onclick="updateAdminPassword()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-xl text-sm">更新管理員密碼</button>
                </div>
            </div>
        </section>

        <!-- 3. 店家員工工作台 -->
        <section id="view-store" class="hidden space-y-6">
            <div class="bg-gradient-to-r from-indigo-900 to-indigo-800 text-white p-6 rounded-2xl shadow-md flex justify-between items-center">
                <div>
                    <span class="text-xs uppercase tracking-widest text-indigo-300 font-semibold">Cloud Store Portal</span>
                    <h2 id="store-title" class="text-2xl font-bold tracking-tight">🏪 分店工作台</h2>
                    <p id="store-info" class="text-xs text-indigo-200 mt-1">載入中...</p>
                </div>
                <button onclick="handleLogout()" class="text-xs bg-white/10 hover:bg-white/20 text-white px-4 py-2 rounded-xl border border-white/10">登出</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 space-y-5">
                    <h3 class="text-lg font-bold text-slate-900">👤 會員點數管理</h3>
                    <select id="member-select" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm" onchange="selectMember()">
                        <option value="">-- 請選擇會員 --</option>
                    </select>
                    <div><label class="block text-xs font-medium text-slate-500 mb-1">手機號碼</label><input type="text" id="cust-phone" placeholder="0912345678" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm"></div>
                    <div><label class="block text-xs font-medium text-slate-500 mb-1">顧客姓名</label><input type="text" id="cust-name" placeholder="王小明" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm"></div>
                    <div><label class="block text-xs font-medium text-slate-500 mb-1">調整點數 (+增加 / -減少)</label><input type="number" id="cust-points" placeholder="10" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm"></div>
                    <div class="flex gap-2">
                        <button onclick="updateMemberPoints()" class="flex-grow bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl text-sm">儲存點數</button>
                        <button onclick="deleteMember()" class="bg-rose-50 text-rose-600 px-4 py-3 rounded-xl text-sm border border-rose-200">刪除</button>
                    </div>
                </div>

                <div class="md:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 space-y-4">
                    <h3 class="text-lg font-bold text-slate-900">👥 本店會員名冊 (雲端即時同步)</h3>
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-200 text-slate-400 text-xs uppercase">
                                <th class="py-3 px-4">姓名</th>
                                <th class="py-3 px-4">手機號碼</th>
                                <th class="py-3 px-4">點數</th>
                                <th class="py-3 px-4 text-right">最後異動</th>
                            </tr>
                        </thead>
                        <tbody id="member-list-table" class="divide-y divide-slate-100 text-sm"></tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <footer class="text-center py-6 text-xs text-slate-400 border-t border-slate-200 mt-auto">
        &copy; 2026 Supabase 雲端安全 POS 系統. All Rights Reserved.
    </footer>

    <!-- 邏輯與 Supabase 串接 -->
    <script>
        const SUPABASE_URL = 'https://lqhiolijrejahmzoulcs.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxxaGlvbGlqcmVqYWhtem91bGNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5NTQ3ODYsImV4cCI6MjEwODUzMDc4Nn0.qDpea3h33N8WLK1WtL8JQ10D3y1rfiicxFqTFyx9nBs';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentStoreCode = null;
        let cachedStores = [];
        let cachedCustomers = {};

        document.getElementById('login-role').addEventListener('change', function() {
            const wrapper = document.getElementById('store-code-wrapper');
            if (this.value === 'store') wrapper.classList.remove('hidden');
            else wrapper.classList.add('hidden');
        });

        async function handleLogin() {
            const role = document.getElementById('login-role').value;
            const passwordInput = document.getElementById('login-password').value.trim();

            await fetchStores();

            if (role === 'admin') {
                // 檢查管理員密碼（優先從 Supabase 讀取，若無則預設為 8888）
                const { data } = await _supabase.from('settings').select('*').eq('key', 'admin_password').single();
                const correctPassword = data ? data.value : '8888';

                if (passwordInput !== correctPassword) {
                    alert('管理員密碼錯誤！');
                    return;
                }

                document.getElementById('view-login').classList.add('hidden');
                document.getElementById('view-admin').classList.remove('hidden');
                document.getElementById('header-status-badge').innerText = '身分：系統管理員';
                document.getElementById('header-status-badge').classList.remove('hidden');
                renderStoreList();
                renderRuleStoreSelect();
            } else {
                const code = document.getElementById('login-store-code').value.trim();
                const store = cachedStores.find(s => s.code === code);
                
                if (!store) {
                    alert('找不到對應的店家代碼！');
                    return;
                }

                if (passwordInput !== store.password) {
                    alert('分店員工密碼錯誤！');
                    return;
                }

                currentStoreCode = code;
                document.getElementById('view-login').classList.add('hidden');
                document.getElementById('view-store').classList.remove('hidden');
                document.getElementById('store-title').innerText = `🏪 ${store.name} 工作台`;
                document.getElementById('store-info').innerText = `統一編號：${store.tax_id} | 代碼：${store.code}`;
                document.getElementById('header-status-badge').innerText = `分店：${store.name}`;
                document.getElementById('header-status-badge').classList.remove('hidden');
                await fetchCustomers(code);
                renderMemberList();
            }
        }

        function handleLogout() {
            currentStoreCode = null;
            document.getElementById('view-login').classList.remove('hidden');
            document.getElementById('view-admin').classList.add('hidden');
            document.getElementById('view-store').classList.add('hidden');
            document.getElementById('header-status-badge').classList.add('hidden');
            document.getElementById('login-store-code').value = '';
            document.getElementById('login-password').value = '';
        }

        function switchTab(tab) {
            document.getElementById('tab-stores-content').classList.toggle('hidden', tab !== 'stores');
            document.getElementById('tab-rules-content').classList.toggle('hidden', tab !== 'rules');
            document.getElementById('tab-security-content').classList.toggle('hidden', tab !== 'security');
            if (tab === 'rules') renderRuleStoreSelect();
        }

        async function fetchStores() {
            const { data, error } = await _supabase.from('stores').select('*');
            if (!error) cachedStores = data || [];
        }

        async function addStore() {
            const name = document.getElementById('new-store-name').value.trim();
            const tax_id = document.getElementById('new-store-tax').value.trim();
            const code = document.getElementById('new-store-code').value.trim();
            const password = document.getElementById('new-store-pwd').value.trim();

            if (!name || !tax_id || !code || !password) { alert('請完整填寫分店資訊與密碼！'); return; }

            const { error } = await _supabase.from('stores').insert([{ name, tax_id, code, password }]);
            if (error) { alert('新增失敗: ' + error.message); return; }

            await _supabase.from('rules').insert([{ store_code: code, earn_rate: 100, redeem_rate: 1 }]);

            document.getElementById('new-store-name').value = '';
            document.getElementById('new-store-tax').value = '';
            document.getElementById('new-store-code').value = '';
            document.getElementById('new-store-pwd').value = '';
            await fetchStores();
            renderStoreList();
            alert('分店新增成功！');
        }

        async function renderStoreList() {
            await fetchStores();
            const tbody = document.getElementById('store-list-table');
            tbody.innerHTML = '';
            if (cachedStores.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="py-4 text-center text-slate-400">尚無分店</td></tr>`;
                return;
            }
            cachedStores.forEach(s => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="py-3 px-4 font-semibold">${s.name}</td>
                        <td class="py-3 px-4 text-slate-600">${s.tax_id}</td>
                        <td class="py-3 px-4"><span class="bg-indigo-50 text-indigo-700 px-2 py-1 rounded text-xs font-mono">${s.code}</span></td>
                        <td class="py-3 px-4 text-right"><button onclick="deleteStore('${s.code}')" class="text-rose-600 text-xs bg-rose-50 px-3 py-1.5 rounded-lg">刪除</button></td>
                    </tr>
                `;
            });
        }

        async function deleteStore(code) {
            if (confirm('確定要刪除此分店嗎？')) {
                await _supabase.from('stores').delete().eq('code', code);
                await _supabase.from('rules').delete().eq('store_code', code);
                await _supabase.from('customers').delete().eq('store_code', code);
                renderStoreList();
            }
        }

        async function updateAdminPassword() {
            const newPwd = document.getElementById('new-admin-password').value.trim();
            if (!newPwd) { alert('請輸入新密碼！'); return; }

            const { data } = await _supabase.from('settings').select('*').eq('key', 'admin_password').single();
            if (data) {
                await _supabase.from('settings').update({ value: newPwd }).eq('key', 'admin_password');
            } else {
                await _supabase.from('settings').insert([{ key: 'admin_password', value: newPwd }]);
            }
            document.getElementById('new-admin-password').value = '';
            alert('管理員密碼更新成功！');
        }

        async function renderRuleStoreSelect() {
            await fetchStores();
            const sel = document.getElementById('rule-store-select');
            sel.innerHTML = '';
            if (cachedStores.length === 0) {
                sel.innerHTML = `<option value="">尚無分店</option>`;
                return;
            }
            cachedStores.forEach(s => {
                sel.innerHTML += `<option value="${s.code}">${s.name} (${s.code})</option>`;
            });
            loadRules();
        }

        async function loadRules() {
            const code = document.getElementById('rule-store-select').value;
            if (!code) return;
            const { data } = await _supabase.from('rules').select('*').eq('store_code', code).single();
            if (data) {
                document.getElementById('rule-earn').value = data.earn_rate;
                document.getElementById('rule-redeem').value = data.redeem_rate;
            } else {
                document.getElementById('rule-earn').value = 100;
                document.getElementById('rule-redeem').value = 1;
            }
        }

        async function saveRules() {
            const code = document.getElementById('rule-store-select').value;
            const earn_rate = parseInt(document.getElementById('rule-earn').value) || 100;
            const redeem_rate = parseInt(document.getElementById('rule-redeem').value) || 1;
            if (!code) return;

            const { data } = await _supabase.from('rules').select('*').eq('store_code', code).single();
            if (data) {
                await _supabase.from('rules').update({ earn_rate, redeem_rate }).eq('store_code', code);
            } else {
                await _supabase.from('rules').insert([{ store_code: code, earn_rate, redeem_rate }]);
            }
            alert('規則儲存成功！');
        }

        async function fetchCustomers(storeCode) {
            const { data } = await _supabase.from('customers').select('*').eq('store_code', storeCode);
            cachedCustomers[storeCode] = data || [];
        }

        async function renderMemberList() {
            await fetchCustomers(currentStoreCode);
            const tbody = document.getElementById('member-list-table');
            const sel = document.getElementById('member-select');
            tbody.innerHTML = '';
            sel.innerHTML = `<option value="">-- 請選擇會員 --</option>`;

            const list = cachedCustomers[currentStoreCode] || [];
            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="py-4 text-center text-slate-400">尚無會員紀錄</td></tr>`;
                return;
            }

            list.forEach(c => {
                tbody.innerHTML += `
                    <tr class="hover:bg-indigo-50/50 cursor-pointer" onclick="fillMember('${c.phone}', '${c.name}')">
                        <td class="py-3 px-4 font-semibold">${c.name}</td>
                        <td class="py-3 px-4 text-slate-600 font-mono text-xs">${c.phone}</td>
                        <td class="py-3 px-4 font-bold text-emerald-600">${c.points} 點</td>
                        <td class="py-3 px-4 text-right text-slate-400 text-xs">${c.updated || ''}</td>
                    </tr>
                `;
                sel.innerHTML += `<option value="${c.phone}">${c.name} (${c.phone}) - ${c.points}點</option>`;
            });
        }

        function fillMember(phone, name) {
            document.getElementById('cust-phone').value = phone;
            document.getElementById('cust-name').value = name;
            document.getElementById('member-select').value = phone;
        }

        function selectMember() {
            const phone = document.getElementById('member-select').value;
            if (!phone) { document.getElementById('cust-phone').value = ''; document.getElementById('cust-name').value = ''; return; }
            const list = cachedCustomers[currentStoreCode] || [];
            const c = list.find(item => item.phone === phone);
            if (c) {
                document.getElementById('cust-phone').value = phone;
                document.getElementById('cust-name').value = c.name;
            }
        }

        async function updateMemberPoints() {
            const phone = document.getElementById('cust-phone').value.trim();
            const name = document.getElementById('cust-name').value.trim();
            const change = parseInt(document.getElementById('cust-points').value) || 0;

            if (!phone || !name) { alert('請填寫手機與姓名！'); return; }

            const list = cachedCustomers[currentStoreCode] || [];
            let existing = list.find(item => item.phone === phone);
            let newPoints = change;
            const updatedTime = new Date().toLocaleDateString();

            if (existing) {
                newPoints = existing.points + change;
                if (newPoints < 0) newPoints = 0;
                await _supabase.from('customers').update({ name, points: newPoints, updated: updatedTime }).eq('store_code', currentStoreCode).eq('phone', phone);
            } else {
                if (newPoints < 0) newPoints = 0;
                await _supabase.from('customers').insert([{ store_code: currentStoreCode, phone, name, points: newPoints, updated: updatedTime }]);
            }

            document.getElementById('cust-points').value = '';
            await renderMemberList();
            alert('會員點數雲端更新成功！');
        }

        async function deleteMember() {
            const phone = document.getElementById('cust-phone').value.trim();
            if (!phone) { alert('請選擇或輸入要刪除的手機號碼！'); return; }

            if (confirm(`確定要刪除會員 (${phone}) 嗎？`)) {
                await _supabase.from('customers').delete().eq('store_code', currentStoreCode).eq('phone', phone);
                document.getElementById('cust-phone').value = '';
                document.getElementById('cust-name').value = '';
                await renderMemberList();
                alert('會員已刪除！');
            }
        }
    </script>
</body>
</html>
