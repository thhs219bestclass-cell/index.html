<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>監管端 - 雲端即時同步系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eef2ff', 100: '#e0e7ff', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col antialiased">

    <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🏢</span>
                <h1 class="text-lg font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent tracking-tight">多店營運與雲端監管後台</h1>
            </div>
            <div class="flex items-center space-x-3">
                <span id="header-status-badge" class="hidden text-xs bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full font-medium border border-indigo-100">未登入</span>
                <a href="../客戶端/customer.html" target="_blank" class="text-xs font-medium text-slate-500 hover:text-indigo-600 bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-full transition">開啟客戶端查詢 ↗</a>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-10 flex-grow w-full space-y-8">
        <!-- 登入畫面 -->
        <section id="view-login" class="max-w-md mx-auto bg-white p-8 sm:p-10 rounded-2xl shadow-sm border border-slate-200/80 space-y-6">
            <div class="text-center space-y-2">
                <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold shadow-inner mb-4">☁️</div>
                <h2 class="text-2xl font-bold text-slate-900 tracking-tight">雲端系統登入</h2>
                <p class="text-sm text-slate-500">正在連線至 Firebase 雲端資料庫...</p>
            </div>

            <div class="space-y-4 pt-2">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">登入身分</label>
                    <select id="login-role" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-slate-700 font-medium focus:ring-2 focus:ring-indigo-600 focus:bg-white focus:outline-none transition" onchange="toggleStoreInput()">
                        <option value="admin">系統管理員 (總公司免統編)</option>
                        <option value="store">店家員工 (分店獨立代碼)</option>
                    </select>
                </div>

                <div id="store-code-wrapper" class="hidden space-y-1.5">
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">店家代碼</label>
                    <input type="text" id="login-store-code" placeholder="請輸入分店代碼 (例: store01)" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-slate-700 font-medium focus:ring-2 focus:ring-indigo-600 focus:bg-white focus:outline-none transition">
                </div>

                <button onclick="handleBusinessLogin()" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-semibold py-3.5 rounded-xl transition shadow-md shadow-indigo-200 mt-2">
                    安全登入工作台
                </button>
            </div>
        </section>

        <!-- 管理員儀表板 -->
        <section id="view-admin" class="hidden space-y-6">
            <div class="bg-gradient-to-r from-slate-900 to-indigo-950 text-white p-6 rounded-2xl shadow-md flex justify-between items-center">
                <div>
                    <span class="text-xs uppercase tracking-widest text-indigo-400 font-semibold">Cloud Super Admin</span>
                    <h2 class="text-2xl font-bold tracking-tight">雲端總控台</h2>
                </div>
                <button onclick="businessLogout()" class="text-xs bg-white/10 hover:bg-white/20 text-white px-4 py-2 rounded-xl transition border border-white/10">安全登出</button>
            </div>

            <div class="flex space-x-2 bg-white p-1.5 rounded-xl border border-slate-200/80 shadow-sm w-fit">
                <button onclick="switchAdminTab('stores')" id="tab-stores-btn" class="px-5 py-2.5 font-medium text-sm rounded-lg bg-indigo-600 text-white shadow-sm transition">公司與分店管理</button>
                <button onclick="switchAdminTab('rules')" id="tab-rules-btn" class="px-5 py-2.5 font-medium text-sm rounded-lg text-slate-600 hover:text-slate-900 transition">各店規則制定</button>
            </div>

            <!-- 分店管理 -->
            <div id="admin-tab-stores" class="space-y-6">
                <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-200/80 space-y-4">
                    <h3 class="text-lg font-bold text-slate-900">➕ 新增公司與連鎖分店</h3>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 pt-1">
                        <input type="text" id="new-company-name" placeholder="分店名稱" class="bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm">
                        <input type="text" id="new-tax-id" placeholder="統一編號 (8碼)" class="bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm">
                        <input type="text" id="new-store-code" placeholder="登入店家代碼" class="bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm">
                        <button onclick="addStore()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl transition text-sm">立即建立分店</button>
                    </div>
                </div>

                <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-200/80 space-y-4">
                    <h3 class="text-lg font-bold text-slate-900">📋 已註冊的分店清單</h3>
                    <table class="w-full text-left border-collapse">
                        <thead><tr class="border-b border-slate-200 text-slate-400 text-xs uppercase"><th class="py-3 px-4">名稱</th><th class="py-3 px-4">統編</th><th class="py-3 px-4">代碼</th><th class="py-3 px-4 text-right">操作</th></tr></thead>
                        <tbody id="store-list-table" class="divide-y divide-slate-100 text-sm"></tbody>
                    </table>
                </div>
            </div>

            <!-- 規則制定 -->
            <div id="admin-tab-rules" class="hidden bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-200/80 space-y-6">
                <h3 class="text-lg font-bold text-slate-900">⚙️ 制定各分店專屬集點與折抵規則</h3>
                <select id="rule-target-store" class="w-full max-w-md bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm" onchange="loadStoreRulesToForm()"></select>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-50 p-6 rounded-2xl border border-slate-200/80">
                    <div><label class="block text-xs font-bold mb-1.5">消費金額折抵點數比例 (元/點)</label><input type="number" id="rule-earn-rate" class="w-full bg-white border border-slate-300 rounded-xl p-3 text-sm"></div>
                    <div><label class="block text-xs font-bold mb-1.5">點數折抵現金價值 (元/點)</label><input type="number" id="rule-redeem-rate" class="w-full bg-white border border-slate-300 rounded-xl p-3 text-sm"></div>
                </div>
                <button onclick="saveStoreRules()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-xl text-sm">儲存該分店規則</button>
            </div>
        </section>

        <!-- 店家工作台 -->
        <section id="view-store" class="hidden space-y-6">
            <div class="bg-gradient-to-r from-indigo-900 to-indigo-800 text-white p-6 rounded-2xl shadow-md flex justify-between items-center">
                <div>
                    <span class="text-xs uppercase tracking-widest text-indigo-300 font-semibold">Cloud Store Portal</span>
                    <h2 id="current-store-title" class="text-2xl font-bold tracking-tight">🏪 店家工作台</h2>
                    <p id="current-store-tax" class="text-xs text-indigo-200 mt-1">載入中...</p>
                </div>
                <button onclick="businessLogout()" class="text-xs bg-white/10 hover:bg-white/20 text-white px-4 py-2 rounded-xl border border-white/10">安全登出</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 space-y-5">
                    <h3 class="text-lg font-bold text-slate-900">👤 選擇會員與點數管理</h3>
                    <select id="member-select" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm" onchange="onMemberSelected()">
                        <option value="">-- 選擇現有會員或手動輸入 --</option>
                    </select>
                    <div><label class="block text-xs font-medium text-slate-500 mb-1">手機號碼</label><input type="text" id="customer-phone" placeholder="0912345678" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm"></div>
                    <div><label class="block text-xs font-medium text-slate-500 mb-1">顧客姓名</label><input type="text" id="customer-name" placeholder="王小明" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm"></div>
                    <div><label class="block text-xs font-medium text-slate-500 mb-1">調整點數 (+增加 / -減少)</label><input type="number" id="point-change" placeholder="10" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm"></div>
                    <div class="flex gap-2">
                        <button onclick="updatePoints()" class="flex-grow bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl text-sm">儲存點數</button>
                        <button onclick="deleteSelectedCustomer()" class="bg-rose-50 text-rose-600 px-4 py-3 rounded-xl text-sm border border-rose-200">刪除</button>
                    </div>
                </div>

                <div class="md:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 space-y-4">
                    <h3 class="text-lg font-bold text-slate-900">👥 本店會員名冊 (雲端即時同步)</h3>
                    <table class="w-full text-left border-collapse">
                        <thead><tr class="border-b border-slate-200 text-slate-400 text-xs uppercase"><th class="py-3 px-4">姓名</th><th class="py-3 px-4">手機</th><th class="py-3 px-4">點數</th><th class="py-3 px-4 text-right">最後異動</th></tr></thead>
                        <tbody id="customer-list-table" class="divide-y divide-slate-100 text-sm"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- Firebase 雲端資料庫邏輯 (使用最新 Modular SDK) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCF7wR7POu3uCZZob_HQxl6dBP79n0YZFc",
            authDomain: "pos-system-2e0c2.firebaseapp.com",
            databaseURL: "https://pos-system-2e0c2-default-rtdb.firebaseio.com",
            projectId: "pos-system-2e0c2",
            storageBucket: "pos-system-2e0c2.firebasestorage.app",
            messagingSenderId: "491150417656",
            appId: "1:491150417656:web:e6f1c6cf3aab6f18cfe50d",
            measurementId: "G-745N7CJZ68"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const dbRef = ref(database);

        window.globalDb = { stores: [], rules: {}, customers: {} };
        window.currentStoreCode = null;

        // 即時監聽雲端資料庫變動
        onValue(dbRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                window.globalDb = data;
            } else {
                window.globalDb = { stores: [], rules: {}, customers: {} };
            }
            if (window.currentStoreCode) {
                renderCustomerList();
            }
            const activeViewAdmin = !document.getElementById('view-admin').classList.contains('hidden');
            if (activeViewAdmin) {
                renderStoreList();
            }
        });

        window.saveToCloud = function() {
            set(dbRef, window.globalDb);
        };

        window.toggleStoreInput = function() {
            const role = document.getElementById('login-role').value;
            document.getElementById('store-code-wrapper').classList.toggle('hidden', role !== 'store');
        };

        window.handleBusinessLogin = function() {
            const role = document.getElementById('login-role').value;
            const statusBadge = document.getElementById('header-status-badge');
            
            if (role === 'admin') {
                document.getElementById('view-login').classList.add('hidden');
                document.getElementById('view-admin').classList.remove('hidden');
                statusBadge.innerText = '身分：系統管理員';
                statusBadge.classList.remove('hidden');
                renderStoreList();
                renderRuleStoreSelect();
            } else {
                const code = document.getElementById('login-store-code').value.trim();
                const store = window.globalDb.stores.find(s => s.code === code);
                if (store) {
                    window.currentStoreCode = code;
                    document.getElementById('view-login').classList.add('hidden');
                    document.getElementById('view-store').classList.remove('hidden');
                    document.getElementById('current-store-title').innerText = `🏪 ${store.name} 工作台`;
                    document.getElementById('current-store-tax').innerText = `統一編號：${store.taxId} | 代碼：${store.code}`;
                    statusBadge.innerText = `分店：${store.name}`;
                    statusBadge.classList.remove('hidden');
                    renderCustomerList();
                } else {
                    alert('找不到對應的店家代碼！');
                }
            }
        };

        window.businessLogout = function() {
            window.currentStoreCode = null;
            document.getElementById('view-login').classList.remove('hidden');
            document.getElementById('view-admin').classList.add('hidden');
            document.getElementById('view-store').classList.add('hidden');
            document.getElementById('header-status-badge').classList.add('hidden');
            document.getElementById('login-store-code').value = '';
        };

        window.switchAdminTab = function(tab) {
            document.getElementById('admin-tab-stores').classList.toggle('hidden', tab !== 'stores');
            document.getElementById('admin-tab-rules').classList.toggle('hidden', tab !== 'rules');
            if (tab === 'rules') renderRuleStoreSelect();
        };

        window.addStore = function() {
            const name = document.getElementById('new-company-name').value.trim();
            const taxId = document.getElementById('new-tax-id').value.trim();
            const code = document.getElementById('new-store-code').value.trim();
            if (!name || !taxId || !code) { alert('請完整填寫！'); return; }
            
            if (!window.globalDb.stores) window.globalDb.stores = [];
            window.globalDb.stores.push({ name, taxId, code });
            if (!window.globalDb.customers) window.globalDb.customers = {};
            if (!window.globalDb.customers[code]) window.globalDb.customers[code] = {};
            if (!window.globalDb.rules) window.globalDb.rules = {};
            window.globalDb.rules[code] = { earnRate: 100, redeemRate: 1 };
            
            window.saveToCloud();
            document.getElementById('new-company-name').value = '';
            document.getElementById('new-tax-id').value = '';
            document.getElementById('new-store-code').value = '';
            renderStoreList();
            alert('分店新增成功！');
        };

        function renderStoreList() {
            const tbody = document.getElementById('store-list-table');
            tbody.innerHTML = '';
            if (!window.globalDb.stores || window.globalDb.stores.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="py-6 text-center text-slate-400">尚無分店</td></tr>`;
                return;
            }
            window.globalDb.stores.forEach((store, index) => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="py-3 px-4 font-semibold">${store.name}</td>
                        <td class="py-3 px-4 text-slate-600">${store.taxId}</td>
                        <td class="py-3 px-4"><span class="bg-indigo-50 text-indigo-700 px-2 py-1 rounded text-xs font-mono">${store.code}</span></td>
                        <td class="py-3 px-4 text-right"><button onclick="deleteStore(${index})" class="text-rose-600 text-xs bg-rose-50 px-3 py-1.5 rounded-lg">刪除</button></td>
                    </tr>
                `;
            });
        }

        window.deleteStore = function(index) {
            if (confirm('確定刪除此分店？')) {
                const code = window.globalDb.stores[index].code;
                window.globalDb.stores.splice(index, 1);
                if (window.globalDb.customers) delete window.globalDb.customers[code];
                if (window.globalDb.rules) delete window.globalDb.rules[code];
                window.saveToCloud();
                renderStoreList();
            }
        };

        function renderRuleStoreSelect() {
            const select = document.getElementById('rule-target-store');
            select.innerHTML = '';
            if (!window.globalDb.stores || window.globalDb.stores.length === 0) {
                select.innerHTML = `<option value="">尚無分店</option>`;
                return;
            }
            window.globalDb.stores.forEach(store => {
                select.innerHTML += `<option value="${store.code}">${store.name} (${store.code})</option>`;
            });
            loadStoreRulesToForm();
        }

        window.loadStoreRulesToForm = function() {
            const storeCode = document.getElementById('rule-target-store').value;
            if (!storeCode) return;
            const r = (window.globalDb.rules && window.globalDb.rules[storeCode]) ? window.globalDb.rules[storeCode] : { earnRate: 100, redeemRate: 1 };
            document.getElementById('rule-earn-rate').value = r.earnRate;
            document.getElementById('rule-redeem-rate').value = r.redeemRate;
        };

        window.saveStoreRules = function() {
            const storeCode = document.getElementById('rule-target-store').value;
            if (!storeCode) return;
            if (!window.globalDb.rules) window.globalDb.rules = {};
            window.globalDb.rules[storeCode] = {
                earnRate: parseInt(document.getElementById('rule-earn-rate').value) || 100,
                redeemRate: parseInt(document.getElementById('rule-redeem-rate').value) || 1
            };
            window.saveToCloud();
            alert('規則更新成功！');
        };

        function renderCustomerList() {
            const tbody = document.getElementById('customer-list-table');
            const selectEl = document.getElementById('member-select');
            tbody.innerHTML = '';
            selectEl.innerHTML = `<option value="">-- 選擇會員 --</option>`;

            const storeCustomers = (window.globalDb.customers && window.globalDb.customers[window.currentStoreCode]) ? window.globalDb.customers[window.currentStoreCode] : {};
            const keys = Object.keys(storeCustomers);

            if (keys.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="py-6 text-center text-slate-400">尚無會員</td></tr>`;
                return;
            }

            keys.forEach(phone => {
                const c = storeCustomers[phone];
                tbody.innerHTML += `
                    <tr class="hover:bg-indigo-50/50 cursor-pointer" onclick="selectMember('${phone}', '${c.name}')">
                        <td class="py-3 px-4 font-semibold">${c.name}</td>
                        <td class="py-3 px-4 text-slate-600 font-mono text-xs">${phone}</td>
                        <td class="py-3 px-4 font-extrabold text-emerald-600">${c.points} 點</td>
                        <td class="py-3 px-4 text-right text-slate-400 text-xs">${c.updated}</td>
                    </tr>
                `;
                selectEl.innerHTML += `<option value="${phone}">${c.name} (${phone}) - ${c.points}點</option>`;
            });
        }

        window.selectMember = function(phone, name) {
            document.getElementById('customer-phone').value = phone;
            document.getElementById('customer-name').value = name;
            document.getElementById('member-select').value = phone;
        };

        window.onMemberSelected = function() {
            const phone = document.getElementById('member-select').value;
            if (!phone) { document.getElementById('customer-phone').value = ''; document.getElementById('customer-name').value = ''; return; }
            const storeCustomers = window.globalDb.customers[window.currentStoreCode] || {};
            if (storeCustomers[phone]) {
                document.getElementById('customer-phone').value = phone;
                document.getElementById('customer-name').value = storeCustomers[phone].name;
            }
        };

        window.updatePoints = function() {
            const phone = document.getElementById('customer-phone').value.trim();
            const name = document.getElementById('customer-name').value.trim();
            const change = parseInt(document.getElementById('point-change').value) || 0;

            if (!phone || !name) { alert('請填寫手機與姓名！'); return; }

            if (!window.globalDb.customers) window.globalDb.customers = {};
            if (!window.globalDb.customers[window.currentStoreCode]) window.globalDb.customers[window.currentStoreCode] = {};
            
            if (!window.globalDb.customers[window.currentStoreCode][phone]) {
                window.globalDb.customers[window.currentStoreCode][phone] = { name: name, points: 0, updated: new Date().toLocaleDateString() };
            } else {
                window.globalDb.customers[window.currentStoreCode][phone].name = name;
            }

            window.globalDb.customers[window.currentStoreCode][phone].points += change;
            if (window.globalDb.customers[window.currentStoreCode][phone].points < 0) window.globalDb.customers[window.currentStoreCode][phone].points = 0;
            window.globalDb.customers[window.currentStoreCode][phone].updated = new Date().toLocaleDateString();

            window.saveToCloud();
            document.getElementById('point-change').value = '';
            renderCustomerList();
            alert('點數更新成功！');
        };

        window.deleteSelectedCustomer = function() {
            const phone = document.getElementById('customer-phone').value.trim();
            if (!phone) { alert('請先選擇會員！'); return; }

            if (confirm(`確定刪除會員 (${phone})？`)) {
                if (window.globalDb.customers && window.globalDb.customers[window.currentStoreCode]) {
                    delete window.globalDb.customers[window.currentStoreCode][phone];
                    window.saveToCloud();
                    document.getElementById('customer-phone').value = '';
                    document.getElementById('customer-name').value = '';
                    renderCustomerList();
                    alert('已刪除！');
                }
            }
        };
    </script>
</body>
</html>
